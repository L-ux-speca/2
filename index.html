/* The original JPEG/PNG bytes are kept at their native resolution. */
.fighter-portrait {
  position: relative;
  display: grid;
  place-items: center;
  height: 142px;
  min-height: 142px;
  width: 100%;
  overflow: hidden;
  background: radial-gradient(ellipse at center, color-mix(in srgb, var(--portrait-accent) 12%, transparent), #101925 80%);
}
.portrait-original {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center;
  image-rendering: auto;
}
.fighter-info .fighter-portrait {
  width: 110px;
  height: 130px;
  min-height: 130px;
  flex: 0 0 110px;
  border-radius: 6px;
}
.hero-with-portrait { isolation: isolate; }
.hero-with-portrait #homeArt { opacity: .07; }
.hero-featured-portrait {
  position: absolute;
  z-index: 0;
  right: 0;
  bottom: 0;
  width: 60%;
  height: 94%;
  object-fit: contain;
  object-position: right bottom;
  pointer-events: none;
  image-rendering: auto;
  filter: drop-shadow(-18px 20px 35px #0009);
}
.hero-with-portrait::after {
  content: '';
  position: absolute;
  z-index: 1;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(90deg, #0a121b96 0%, #0a121b4f 39%, transparent 74%);
}
.hero-with-portrait .hero-copy, .hero-with-portrait .hero-bottom { z-index: 2; }
.home-portrait-selector { margin-top: 20px; padding: 17px 19px; background: #101a27; border: 1px solid #28394a; border-radius: 9px; }
.home-portrait-heading { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; justify-content: space-between; padding-bottom: 12px; }
.home-portrait-heading h3 { font-size: 20px; margin: 5px 0 0; }
.home-portrait-heading small { color: #9eb2be; }
.home-portrait-strip { display: grid; grid-template-columns: repeat(14, minmax(76px, 1fr)); gap: 9px; overflow-x: auto; padding: 5px 2px 12px; }
.home-portrait-button {
  padding: 5px;
  min-width: 76px;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  border: 1px solid #344351;
  border-radius: 6px;
  background: #151f2d;
  transition: border-color .15s, transform .15s;
}
.home-portrait-button:hover { border-color: #a1f0d8; transform: translateY(-2px); }
.home-portrait-button.selected { border-color: #79eacf; box-shadow: 0 0 0 2px #79eacf35; }
.home-portrait-button img { width: 100%; height: 108px; object-fit: contain; image-rendering: auto; }
.home-portrait-button span { font-size: 10px; padding-top: 5px; text-align: center; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
@media (max-width: 950px) {
  .home-portrait-strip { grid-template-columns: repeat(14, 88px); }
  .hero-featured-portrait { width: 66%; }
}
@media (max-width: 620px) {
  .hero-featured-portrait { width: 72%; height: 83%; opacity: .72; }
  .hero-with-portrait::after { background: linear-gradient(90deg, #0a121bc7 0%, #0a121b6b 45%, transparent); }
  .fighter-portrait { height: 105px; min-height: 105px; }
  .home-portrait-selector { padding: 14px 10px; }
}

  --muted:#d5b4a2; --cyan:#f6b36c; --pink:#ff9688; --gold:#fbe0a4;
  background:radial-gradient(circle at 45% -15%,#53342a,#23191b 60%);
}
body.warm .topbar,body.warm .game-shell,body.warm .menu,body.warm .panel,
body.warm .step-card,body.warm .char-card,body.warm .modal,
body.warm .hero,body.warm .hintbox,body.warm input,body.warm select,
body.warm textarea,body.warm .stats div,body.warm .mode-btn:not(.primary) {
  background-color:#332423;
  border-color:#725047;
}
body.warm .hero {
  background-image:radial-gradient(ellipse at 63% 68%,#78533c,#382927 63%,#241a1b);
}
body.warm button:not(.primary):not(.ghost),body.warm .slot-btn {background:#49302c;border-color:#855c4b}
body.warm button:not(.primary):hover {background:#684139}
body.warm .primary {color:#301d19}
body.warm .hero-copy p,body.warm .feature p,body.warm .help-table {color:#ecd1bc}

body.contrast {
  --bg:#000; --panel:#000; --line:#fff; --ink:#fff;
  --muted:#fff; --cyan:#00ffcf; --pink:#ff4d82; --gold:#ffea00;
  background:#000;
}
body.contrast .topbar,body.contrast .game-shell,body.contrast .panel,
body.contrast .step-card,body.contrast .char-card,body.contrast .modal,
body.contrast .hero,body.contrast .hintbox,body.contrast input,
body.contrast select,body.contrast textarea,body.contrast .stats div,
body.contrast .mode-btn:not(.primary) {background-color:#000;border-color:#fff}
body.contrast .hero {background-image:radial-gradient(ellipse,#00251f,#000 68%)}
body.contrast button:not(.primary) {background:#070707;border-color:#fff;color:#fff}
body.contrast button:hover {background:#152a25}
body.contrast .primary {color:#000}
body.contrast .hero-copy p,body.contrast .feature p,body.contrast .help-table,
body.contrast .footer,body.contrast .hero-bottom span {color:#fff}

.result p.muted {line-height:1.9;max-width:600px;margin:auto}
.help-table kbd {white-space:normal;text-align:right}
.dash-status {flex-shrink:0;min-width:110px;padding:5px 9px;border:1px solid #4b5967;border-radius:5px;color:#a2adbb;font-size:10px;letter-spacing:.5px;text-align:center;}
.dash-status.ready {border-color:#54867d;background:#1b393a;color:#a9efda;}
.dash-status b {display:block;font-size:11px;letter-spacing:0;}
@media(max-width:760px){.dash-status{display:none}}

closeModal(){this.modal=false;$('#modalRoot').innerHTML='';if(this.paused){this.paused=false;AudioSys.resume()}Input.clear();rebind=null},
modes(){AudioSys.init();this.modalBox('Режим поединка',`<div class="two-cols">${MODES.map(([id,n,d])=>`<button class="mode-btn" onclick="App.chooseMode('${id}')" style="margin:0"><div><b>${n}</b><small>${d}</small></div><span class="arrow">→</span></button>`).join('')}</div><p class="help-note">Совет: начни с тренировки, чтобы проверить приёмы и привыкнуть к дистанции.</p>`,true)},
chooseMode(id){this.config.mode=id;this.closeModal();this.select()},
select(){if(Net.peer)Net.close();this.setScreen('select');this.selectionSide=0;this.drawSelect()},
drawSelect(){const c=char(this.config['p'+(this.selectionSide+1)]);$('#app').innerHTML=`<header class="screen-head"><div><div class="eyebrow">${esc(MODES.find(x=>x[0]===this.config.mode)?.[1]||'Выбор бойцов')}</div><h2>Кто выйдет на арену?</h2></div><button class="ghost" onclick="App.home()">← Назад</button></header><div class="select-layout"><section><div class="row spread" style="margin-bottom:15px"><div class="row"><button class="select-tab ${this.selectionSide===0?'active':''}" onclick="App.side(0)">P1 · ${char(this.config.p1).short}</button><button class="select-tab enemy ${this.selectionSide===1?'active':''}" onclick="App.side(1)">${this.config.mode==='local'?'P2':'Соперник'} · ${char(this.config.p2).short}</button></div><button class="ghost" style="padding:6px 10px;font-size:11px" onclick="App.pickChar(pick(CHARS).id)">⤨ Случайный</button></div><div class="roster">${CHARS.map(d=>`<button class="char-card ${d.id===this.config.p1?'p1':''} ${d.id===this.config.p2?'p2':''}" onclick="App.pickChar('${d.id}')" title="${d.name}">${portrait(d)}${d.id===this.config.p1?'<span class="badge">P1</span>':''}${d.id===this.config.p2?'<span class="badge two" style="left:auto;right:6px">P2</span>':''}<div class="cc-copy"><b>${d.short}</b><small>${d.hp} HP / ${d.pe} ПЭ</small></div></button>`).join('')}</div><div class="settings-grid"><div class="field"><label>АРЕНА</label><select onchange="App.config.arena=this.value;App.drawSelect()">${ARENAS.map(([id,n])=>`<option value="${id}" ${id===this.config.arena?'selected':''}>${n}</option>`).join('')}</select></div><div class="field"><label>РАУНДОВ ДО ПОБЕДЫ</label><select onchange="App.config.rounds=+this.value">${[1,2,3].map(i=>`<option ${i===this.config.rounds?'selected':''}>${i}</option>`).join('')}</select></div><div class="field"><label>СЛОЖНОСТЬ РТ</label><select onchange="App.config.difficulty=this.value"><option value="easy" ${this.config.difficulty==='easy'?'selected':''}>Easy</option><option value="hard" ${this.config.difficulty==='hard'?'selected':''}>Lunatic</option></select></div></div><div class="arena-preview">${ARENAS.map(([id,n])=>`<div role="button" tabindex="0" class="arena-chip ${this.config.arena===id?'selected':''}" onclick="App.config.arena='${id}';App.drawSelect()" onkeydown="if(event.key==='Enter')this.click()"><span>${n}</span></div>`).join('')}</div></section><aside class="panel select-info"><div class="fighter-info">${portrait(c)}<div><div class="eyebrow">${this.selectionSide===0?'Игрок 1':'Соперник'}</div><h3>${c.name}</h3><small>${c.tag}</small></div></div><div class="stats"><div><b>${c.hp}</b><small>ЗДОРОВЬЕ</small></div><div><b>${c.pe}</b><small>ЭНЕРГИЯ</small></div><div><b>${c.speed}</b><small>СКОРОСТЬ</small></div></div><div class="skills-info">${c.skills.map((s,i)=>`<div class="skill-info"><em>${s.cost} ПЭ / ${s.cd||'—'} с</em><b>${i+1}. ${s.name}</b><span class="muted">${s.desc}${s.passive?' · пассивная':''}</span></div>`).join('')}</div><p class="hintbox" style="margin-top:14px">${c.id==='araya'?'Против ИИ-Араи в режиме 1 на 1 шкала РТ начинается с 0%. При 100% бой превратится в корабельное испытание.':c.id==='lapis'?'Сначала создай магнитную точку приёмом 3, затем дважды нажми A или D, чтобы перенестись к ней.':'Удар рукой можно обойти приседом, низкий удар — прыжком. Блок в первые 0,12 с полностью отражает урон.'}</p></aside></div><div class="panel" style="margin-top:20px;padding:14px 18px"><div class="row spread"><span style="font-size:12px">Модификаторы <small> · до пяти</small></span><button class="ghost" style="padding:3px 8px;font-size:11px" onclick="App.config.rules=[...RULES].sort(()=>Math.random()-.5).slice(0,3).map(x=>x[0]);App.drawSelect()">⤨ Рулетка</button></div><div class="rule-list"><button class="rule ${!this.config.rules.length?'active':''}" onclick="App.config.rules=[];App.drawSelect()">Обычные правила</button>${RULES.map(([id,n,d])=>`<button class="rule ${this.config.rules.includes(id)?'active':''}" title="${d}" onclick="App.toggleRule('${id}')">${n}</button>`).join('')}</div></div><div class="select-footer"><div class="control-hint"><kbd>A</kbd><kbd>D</kbd> движение <kbd>W</kbd> прыжок <kbd>C</kbd> блок<br><kbd>Z</kbd><kbd>X</kbd> удары <kbd>1–4</kbd> техники <kbd>V</kbd> бросок</div><button class="primary" style="min-width:260px" onclick="App.start()">${this.config.mode==='online'?'Открыть сетевую комнату':'Начать бой'} &nbsp; ↗</button></div>`},
side(i){this.selectionSide=i;this.drawSelect()},pickChar(id){this.config['p'+(this.selectionSide+1)]=id;AudioSys.sfx('target');this.drawSelect()},toggleRule(id){const a=this.config.rules;if(a.includes(id))a.splice(a.indexOf(id),1);else if(a.length<5)a.push(id);else toast('Можно выбрать не больше пяти правил');this.drawSelect()},

rtSelect(){this.modalBox('РТ Араи · Корабль Тесея',`<div class="stack"><p class="muted" style="font-size:12px">Три фазы. Флот, эскорт и четыре разрушаемых узла. Стреляй, переключай цели и ищи проходы между залпами.</p><div class="field"><label>ТВОЙ БОЕЦ</label><select id="rtHero">${CHARS.map(c=>`<option value="${c.id}" ${this.config.p1===c.id?'selected':''}>${c.name}</option>`).join('')}</select></div><div class="field"><label>СЛОЖНОСТЬ</label><select id="rtDifficulty"><option value="easy">Easy · читаемые залпы</option><option value="hard">Lunatic · плотный обстрел</option></select></div><p class="hintbox">WASD / стрелки — движение · Space — огонь · Q — цель · Shift / двойное направление — рывок. Приёмы 1–4 адаптированы к корабельному бою. Автоогонь включён по умолчанию.</p><button class="primary" onclick="App.launchTestRT()">Войти в территорию ↗</button></div>`)},launchTestRT(){const id=$('#rtHero').value,d=$('#rtDifficulty').value;this.config.p1=id;this.config.difficulty=d;this.closeModal();RT.start(id,d,true)},
gameUI(rt=false){this.setScreen(rt?'rt':'fight');$('#app').innerHTML=`<section class="game-shell"><div class="game-top"><div class="brand"><div class="mark"><b>ϟ</b></div><div class="brand-name">CLASH OF CHAMPIONS</div></div><span id="matchLabel" class="pill">${rt?'КОРАБЛЬ ТЕСЕЯ':'ПОЕДИНОК'}</span><div class="row" style="gap:6px"><button id="finishAction" class="hidden" onclick="Input.pressed.add(Keys[0].finish)">Добивание</button><button class="ghost" onclick="App.customMenu()" title="Приёмы конструктора">＋</button><button class="ghost" onclick="App.help()">?</button><button class="ghost" onclick="App.fullscreen()" aria-label="Полный экран">⛶</button><button class="ghost" onclick="App.pause()">Ⅱ Пауза</button></div></div><div class="viewport"><canvas id="gameCanvas" width="${rt?960:1100}" height="${rt?600:550}"></canvas><div class="hud"><div class="hud-side"><div class="hud-label"><strong id="p1Name"></strong><span id="p1HP"></span></div><div class="hp-track"><div class="hp-fill" id="p1HPBar"></div></div><div class="pe-track"><div class="pe-fill" id="p1PEBar"></div></div><div class="guard-track"><div class="guard-fill" id="p1GuardBar"></div></div><div class="hud-meta" id="p1Meta"></div></div><div><div class="timer" id="timer">120</div><div class="round-dots" id="rounds"></div></div><div class="hud-side right"><div class="hud-label"><span id="p2HP"></span><strong id="p2Name"></strong></div><div class="hp-track"><div class="hp-fill" id="p2HPBar"></div></div><div class="pe-track"><div class="pe-fill" id="p2PEBar"></div></div><div class="guard-track"><div class="guard-fill" id="p2GuardBar"></div></div><div class="hud-meta" id="p2Meta"></div><div class="rt-gauge"><div id="rtCharge"></div></div></div></div><div class="rt-top-info ${rt?'':'hidden'}"><div class="graze-block"><b id="attackText">АТАКА 0%</b><div class="graze-track"><div id="attackBar"></div></div><span id="grazeText"></span></div><div class="phase-info"><b id="phaseText"></b><span id="targetText"></span></div></div><div id="announcement" class="announcement"></div><div id="trainingTools" class="training-tools hidden"></div></div><footer class="combat-footer"><div id="skillsBar" class="skills-bar"></div><div class="control-hint game">${rt?'WASD · движение &nbsp; SPACE · огонь<br>Q · цель &nbsp; SHIFT · рывок':'Z / X · удары &nbsp; C · блок &nbsp; V · бросок<br>Shift + 1…6 · свои приёмы'}</div>${rt?'<button class="target-button ghost" onclick="RT.cycleTarget()">Q · ЦЕЛЬ</button>':''}</footer><div id="touchPanel" class="touch-panel"><div class="dpad"><button data-act="up">▲</button><button data-act="left">◀</button><button data-act="down">▼</button><button data-act="right">▶</button></div><div class="touch-actions">${(rt?[['s1','1'],['s2','2'],['s3','3'],['s4','4'],['fire','Огонь'],['dash','Дэш'],['target','Цель'],['finish','＋']]:[['punch','Кулак'],['kick','Нога'],['block','Блок'],['throw','Бросок'],['s1','1'],['s2','2'],['s3','3'],['s4','4']]).map(([a,n])=>`<button data-act="${a}">${n}</button>`).join('')}</div></div></section>`;this.canvas=$('#gameCanvas');this.ctx=this.canvas.getContext('2d');this.hud={};for(const id of ['p1Name','p1HP','p1HPBar','p1PEBar','p1GuardBar','p1Meta','p2Name','p2HP','p2HPBar','p2PEBar','p2GuardBar','p2Meta','timer','rounds','rtCharge','attackText','attackBar','grazeText','phaseText','targetText','announcement','matchLabel'])this.hud[id]=$('#'+id);this.touch();this.canvas.addEventListener('pointermove',e=>{const r=this.canvas.getBoundingClientRect(),ratio=Math.min(r.width/this.canvas.width,r.height/this.canvas.height),w=this.canvas.width*ratio,h=this.canvas.height*ratio;Input.pointer={x:(e.clientX-r.left-(r.width-w)/2)/ratio,y:(e.clientY-r.top-(r.height-h)/2)/ratio}});this.canvas.addEventListener('pointerdown',()=>AudioSys.init())},
touch(){const visible=Pref.touch==='on'||(Pref.touch==='auto'&&matchMedia('(pointer:coarse)').matches);$('#touchPanel')?.classList.toggle('visible',visible);$$('#touchPanel button').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();AudioSys.init();b.setPointerCapture(e.pointerId);const a=b.dataset.act;if(!Input.touchHeld.has(a)){Input.pressed.add('touch:'+a);let t=performance.now();if(t-(Input.lastTap['touch:'+a]||0)<260)Input.double.add('touch:'+a);Input.lastTap['touch:'+a]=t}Input.touchHeld.add(a);b.classList.add('held')});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>{Input.touchHeld.delete(b.dataset.act);b.classList.remove('held')})})},
showSkills(c,rt=false){$('#skillsBar').innerHTML=c.skills.map((s,i)=>`<button id="skill${i}" class="skill-key" onclick="App.pressSkill(${i})" ${s.passive?'disabled':''}><b>${i+1} · ${esc(s.name)}</b><span>${s.passive?'Пассивная':s.cost+' ПЭ'}</span><div class="cool"></div></button>`).join('')},pressSkill(i){Input.pressed.add(Keys[0]['s'+(i+1)])},
announce(title,sub=''){if(this.hud?.announcement)this.hud.announcement.innerHTML=title?`${esc(title)}<div class="announce-sub">${esc(sub)}</div>`:''},
pause(){if(!['fight','rt'].includes(this.screen))return;this.paused=true;Input.clear();AudioSys.pause();const online=Fight.g?.mode==='online';this.modalBox('Пауза',`<div class="stack"><button class="primary" onclick="App.closeModal()">Продолжить бой</button><button onclick="App.settings()">Настройки звука и управления</button>${online?'<p class="hintbox">В сетевом матче пауза локальная. Соперник продолжает бой.</p>':`<div class="section-line" style="margin:8px 0"></div><div class="eyebrow">Читы · действуют на игрока 1</div>${[['god','Неуязвимость'],['energy','Бесконечная ПЭ'],['cooldowns','Без перезарядок']].map(([id,n])=>`<label class="check"><input type="checkbox" ${Cheats[id]?'checked':''} onchange="Cheats.${id}=this.checked">${n}</label>`).join('')}<button onclick="App.heal()">Восстановить здоровье и ПЭ</button>`}<button class="danger" onclick="App.home()">Выйти в меню</button></div>`)},heal(){if(this.screen==='rt'&&RT.g){RT.g.hp=RT.g.c.hp;RT.g.pe=RT.g.c.pe}else if(Fight.g){let f=Fight.g.f[0];f.hp=f.maxHp;f.pe=f.c.pe}toast('Здоровье и ПЭ восстановлены')},
settings(tab='general'){if(['fight','rt'].includes(this.screen)&&Fight.g?.mode!=='online'){this.paused=true;AudioSys.pause()}if(tab==='keys'){this.modalBox('Управление',`<div class="row" style="margin-bottom:16px"><button onclick="App.settings()">← Настройки</button><button onclick="Keys=structuredClone(DEFAULT_KEYS);saveStore('clash-controls-v2',Keys);App.settings('keys')">Сбросить</button></div><p class="help-note" style="margin:0 0 15px">Нажми действие, затем нужную клавишу. При совпадении клавиши меняются местами. Esc отменяет назначение.</p>${Keys.map((k,i)=>`<h3 style="margin:15px 0 9px;font-size:13px">Игрок ${i+1}</h3><div class="binding-list">${Object.entries(k).map(([a,c])=>`<button onclick="rebind=[${i},'${a}'];this.innerHTML='Нажми клавишу…'">${({left:'Влево',right:'Вправо',up:'Прыжок',down:'Присед',block:'Блок',punch:'Кулак',kick:'Нога',throw:'Бросок',finish:'Добивание',s1:'Приём 1',s2:'Приём 2',s3:'Приём 3',s4:'Приём 4'})[a]} <kbd>${keyLabel(c)}</kbd></button>`).join('')}</div>`).join('')}`,true);return}this.modalBox('Настройки',`<div class="two-cols"><div>${[['master','Общая громкость'],['music','Музыка'],['sfx','Эффекты']].map(([k,n])=>`<div class="field"><label>${n} <span id="val-${k}">${Math.round(Pref[k]*100)}%</span></label><input type="range" min="0" max="1" step=".01" value="${Pref[k]}" oninput="Pref.${k}=+this.value;$('#val-${k}').textContent=Math.round(this.value*100)+'%';App.savePrefs()"></div>`).join('')}<div class="field"><label>ВСТРОЕННАЯ МУЗЫКА</label><select onchange="Pref.style=this.value;App.savePrefs()">${['forge','blood','moon'].map(k=>`<option value="${k}" ${Pref.style===k?'selected':''}>${k}</option>`).join('')}</select></div><label class="check">Своя музыка <input type="file" accept="audio/*" style="max-width:175px;font-size:10px" onchange="if(this.files[0])AudioSys.load(this.files[0])"></label><small>Файл играет в текущем сеансе.</small></div><div><div class="field"><label>СЕНСОРНОЕ УПРАВЛЕНИЕ</label><select onchange="Pref.touch= help(){if(['fight','rt'].includes(this.screen)&&Fight.g?.mode!=='online'){this.paused=true;AudioSys.pause();}this.modalBox('Как играть',`<div class="two-cols"><section><div class="eyebrow" style="margin-bottom:12px">Файтинг · игрок 1</div><div class="help-table" style="grid-template-columns:1fr">${[['Движение','A / D'],['Прыжок / присед','W / S'],['Кулак / нога','Z / X'],['Блок / бросок','C / V'],['Техники','1 / 2 / 3 / 4'],['Свои приёмы','Shift + 1…6'],['Добивание после KO','R']].map(([n,k])=>`<p><span>${n}</span><kbd>${k}</kbd></p>`).join('')}</div></section><section><div class="eyebrow" style="margin-bottom:12px">Корабль Тесея · РТ</div><div class="help-table" style="grid-template-columns:1fr">${[['Движение','WASD / стрелки'],['Стрельба','Space / автоогонь'],['Смена цели','Q'],['Рывок','Shift / двойной тап'],['Адаптированные техники','1…4'],['Пауза','Esc']].map(([n,k])=>`<p><span>${n}</span><kbd>${k}</kbd></p>`).join('')}</div></section></div><p class="help-note">В файтинге приседай под высокими атаками и прыгай над низкими. Идеальный блок в первые 0,12 с не пропускает урон. Бросок обходит блок. Удары в контакт возвращают ПЭ.</p><p class="help-note">В РТ пули, прошедшие близко, заполняют шкалу АТАКИ: она ускоряет восстановление первого приёма до ×3. Получение урона не сбрасывает шкалу. Q переключает живые корабли или узлы флагмана; стрельба следует прицелу.</p><p class="help-note">Игрок 2: H/K — ходьба, U/J — прыжок/присед, N/M — удары, B — блок, O — бросок, 7/8/9/Num7 — техники, P — добивание. Клавиши файтинга можно переназначить в настройках.</p>`,true)},

<h3 style="margin-bottom:10px">Помощник по описанию</h3><textarea id="movePrompt" placeholder="Например: два металлических шара, затем выстрел и щит"></textarea><button style="margin-top:8px;font-size:12px" onclick="Builder.generate($('#movePrompt').value)">Собрать по ключевым словам →</button><p class="muted" style="font-size:10px;margin-top:8px">Локальный алгоритм на правилах. Проверяет палитру героя и бюджет; не использует нейросеть.</p></section><aside class="builder-aside"><div class="panel stack"><div><div class="eyebrow">Бюджет мощности</div><div class="budget-big ${!valid&&this.steps.length?'over':''}">${p.budget}<span style="font-size:18px;color:var(--muted);letter-spacing:0"> / 70</span></div><div class="budget-track"><div style="width:${Math.min(100,p.budget/70*100)}%"></div></div></div><div class="row spread"><span class="muted">Стоимость</span><b>${p.cost} / ${c.pe} ПЭ</b></div><div class="row spread"><span class="muted">Перезарядка</span><b>${p.cd} с</b></div><div class="row spread"><span class="muted">Действий</span><b>${this.steps.length} / 6</b></div><div class="builder-timeline">${this.steps.map(s=>`<span title="${s.at} с · ${TYPES[s.type][0]}"></span>`).join('')}</div><button class="primary" ${!valid?'disabled':''} onclick="Builder.save()">Сохранить в слот ${this.slot+1}</button><button ${!valid?'disabled':''} onclick="Builder.test()">Испытать в тренировке</button><button class="ghost danger" onclick="Builder.remove()">Очистить слот</button>${p.budget>70?'<p style="font-size:11px;color:var(--pink)">Уменьши силу, количество или число действий.</p>':''}${p.cost>c.pe?'<p style="font-size:11px;color:var(--pink)">Стоимость превышает запас ПЭ героя.</p>':''}</div><p class="hintbox" style="margin-top:14px">Действия выполняются по времени, условия проверяются в момент шага. Стан прерывает оставшуюся последовательность. Слоты доступны также в РТ, но отключены в локальном бою вдвоём.</p></aside></div>`},

generate(text){if(!text.trim()){toast('Сначала напиши описание');return}const map=[[/шар|орбит/i,'orbit'],[/выстрел|снаряд|стрел|пул/i,'projectile'],[/щит|барьер|защит/i,'shield'],[/зон|поле|луж|ловуш/i,'field'],[/рыв|разгон|телепорт/i,'dash'],[/импульс|взрыв|волн/i,'pulse'],[/леч|восстанов/i,'heal'],[/призыв|клон|рыцар|автомоб|машин|император|анх/i,'summon']];const allowed=char(this.hero).palette.split(' '),hits=[];let rejected=[];for(const [rx,type]of map){const m=rx.exec(text);if(m){if(allowed.includes(type))hits.push({type,index:m.index});else rejected.push(TYPES[type][0])}}if(!hits.length){toast('Не нашёл разрешённых действий для этого героя');return}this.steps=hits.sort((a,b)=>a.index-b.index).slice(0,6).map((h,i)=>({type:h.type,at:i*.5,power:1,range:1,size:1,duration:1,count:/три|3/.test(text)&&['orbit','projectile'].includes(h.type)?3:/два|2/.test(text)&&h.type==='orbit'?2:1,aim:'forward',condition:'always',form:h.type==='summon'&&this.hero==='kisei'?/рыцар/i.test(text)?'knight':/машин|автомоб/i.test(text)?'car':/император/i.test(text)?'emperor':/анх/i.test(text)?'ankh':'guardian':'generic'}));while(this.price(char(this.hero),this.steps).budget>70||this.price(char(this.hero),this.steps).cost>char(this.hero).pe){const s=this.steps.find(x=>x.count>1);if(s)s.count--;else this.steps.pop();if(!this.steps.length)break}this.name='Комбинация · '+char(this.hero).short;this.draw();toast(rejected.length?'Недоступные действия пропущены: '+rejected.join(', '):'Черновик готов. Проверь параметры перед сохранением.')},

// Shared Canvas primitives and procedural fighters/arenas.
function line(ctx,x1,y1,x2,y2,color,w=2){ctx.strokeStyle=color;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function circle(ctx,x,y,r,color,stroke=false,w=1){ctx.beginPath();ctx.arc(x,y,Math.max(.01,r),0,Math.PI*2);if(stroke){ctx.strokeStyle=color;ctx.lineWidth=w;ctx.stroke()}else{ctx.fillStyle=color;ctx.fill()}}
function poly(ctx,points,color,stroke){ctx.beginPath();ctx.moveTo(...points[0]);for(let i=1;i<points.length;i++)ctx.lineTo(...points[i]);ctx.closePath();ctx.fillStyle=color;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}}
function canvasText(ctx,t,x,y,size=12,color='#dce7e4',align='center'){ctx.font=`${size}px system-ui`;ctx.fillStyle=color;ctx.textAlign=align;ctx.fillText(t,x,y)}

<script>
const Net={peer:null,conn:null,role:null,connected:false,input:{},sendClock:0,lastData:0,remoteMoves:[],

async load(){if(window.Peer)return;this.status('Загрузка сетевого модуля…');await new Promise((resolve,reject)=>{let s=document.createElement('script'),timer=setTimeout(()=>{s.remove();reject(Error('Сетевой модуль не ответил. Проверь интернет или выбери локальный бой.'))},8000);s.src='https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';s.onload=()=>{clearTimeout(timer);resolve()};s.onerror=()=>{clearTimeout(timer);s.remove();reject(Error('Не удалось загрузить PeerJS. Онлайн требует доступ к интернету.'))};document.head.append(s)})},
async host(){this.close();this.role='host';try{await this.load();const id='cf-'+Math.floor(rnd(1000,9999));this.peer=new Peer(id,{debug:0});this.peer.on('open',code=>this.status('Код комнаты: '+code+'\nОжидание второго игрока…'));this.peer.on('connection',c=>{if(this.connected){c.close();return}this.bind(c)});this.errors()}catch(e){this.status(e.message,true)}},

else if(d.type==='state'&&Fight.g?.mode==='online'&&this.role==='client'){const s=d.state;if(!s||!Array.isArray(s.f)||s.f.length!==2||!Array.isArray(s.e)||s.e.length>450)return;this.clientState=s;const g=Fight.g;for(let i=0;i<2;i++){const f=s.f[i];if(!Number.isFinite(f.x)||!Number.isFinite(f.y)||!CHARS.some(c=>c.id===f.id))return;g.f[i]={...f,c:char(f.id)}}g.t=s.t;g.time=s.time;g.score=s.score;g.state=s.state;g.stateTime=s.stateTime;g.winner=s.winner;g.e=s.e.map(e=>({...e,hit:new Set(e.hit||[])}));g.fx=[];g.texts=s.texts||[];g.rtGauge=0;if(g.state==='intro')App.announce('РАУНД '+s.round);else if(g.state==='ko')App.announce('НОКАУТ',s.winner===1?'Ты победил · R — добивание':'Победа соперника');else App.announce('');if(g.state==='between'&&!App.modal)App.result('Матч окончен',g.score[1]>=g.target?'ТВОЯ ПОБЕДА':'ПОРАЖЕНИЕ',g.score.join(' : '),"App.home()");Fight.updateHUD()}}
,

// The situational choices and character-specific weights are adapted from the
// more detailed combat AI in index(1).html, using the new engine's commands.
const AI_PROFILES = Object.freeze({
  yuzuha: (d,f,e) => [d<115?3:0, d<170&&!e.crouch?2:0, f.hp<f.maxHp*.55?2:0],
  caesar: (d,f) => [d<245?2.4:0, d>95&&d<340?2.1:0, !f.shield&&d<200?2:0],
  araya: d => [d>125?3:1, d>170?2:0, d<230?2.1:0],
  lapis: (d,f,e,g) => [d>145&&d<275&&!g.e.some(o=>o.owner===f.side&&o.kind==='orbit')?2.4:0,
    e.grounded&&d>90?3:0, !f.magnet&&(d>260||f.x<115||f.x>985)?2:0],
  tori: (d,f) => [!f.flying&&f.pe>45?2.2:f.flying&&f.pe<17?2.4:0,
    d<400?1.5:0, f.flying&&f.y<400&&d<170?3:0,
    f.maxHp-f.hp>=25?4:0],
  akira: (d,f,e) => [d<200&&!e.crouch?2.4:0,d<170?2.5:0,e.grounded&&d>85?2:0],
  sonic: (d,f) => [f.hp>45&&!(f.st.speed>0)?1.4:0,d<350?2.2:0,
    !(f.st.katana>0)&&d<190?2.7:0],
  david: (d,f) => [d<115&&!(f.st.fist>0)?2.5:0,d>110?2:0,d<340?1.8:0],
  chieko: d => [d>100&&d<350?2:0,d<400?2:0,d<170?1.7:0,d<270?3:0],
  airi: d => [d<480?2.2:0,d<230?2.1:0,d>100&&d<450?2.6:0],
  dio: (d,f,e,g) => [d<115?3:0,d<145&&(e.attack||g.e.some(o=>o.owner===e.side))?3:0,0],
  kayano: (d,f) => [d<118?(f.comboPoints>=2?4:1.2):0],
  mechamaru: (d,f) => [d>100?3:1.5,d<500?2.5:0,
    !f.robot?2.7:0],
  kisei: (d,f,e) => [e.grounded&&d>150?2.5:0,d>60&&d<180?2.2:0,
    d<380?2:0,d<500?2:0]
});

if (!['easy','normal','hard'].includes(Pref.aiDifficulty)) Pref.aiDifficulty = 'normal';

  first.append(field);
  field.querySelector('select').value = Pref.aiDifficulty;
  field.querySelector('select').addEventListener('change', event => {
    Pref.aiDifficulty = event.target.value;

Fight.ai = function(f, opponent) {
  const dt = 1/60, g = this.g;
  const d = Math.abs(opponent.x - f.x);
  const direction = Math.sign(opponent.x - f.x) || f.face;
  const ranged = !['sonic','tori','dio','kayano'].includes(f.id);
  const difficulty = Pref.aiDifficulty || 'normal';
  const reaction = difficulty === 'hard' ? .13 : difficulty === 'easy' ? .42 : .26;
  const defenseChance = difficulty === 'hard' ? .8 : difficulty === 'easy' ? .24 : .5;

  const brain = f._brain ??= {style:'approach',styleLeft:0,dodgeUntil:0,hopReady:0};
  brain.styleLeft -= dt;
  brain.dodgeUntil = Math.max(0,brain.dodgeUntil-dt);
  brain.hopReady = Math.max(0,brain.hopReady-dt);
  if (brain.styleLeft <= 0) {
    brain.styleLeft = 1.1+Math.random()*1.7;
    brain.style = Math.random()<(ranged?.24:.13)?'space':'approach';
  }
  const ideal = ranged ? 170 : 65;
  const command = {};
  if (d > ideal + 28 || (d>110&&brain.style==='approach'))
    command[direction>0?'right':'left']=true;
  else if (brain.style==='space'&&d<ideal-42&&d>45)
    command[direction>0?'left':'right']=true;

  const approachingProjectile = g.e.some(projectile =>
    projectile.owner!==f.side&&projectile.kind==='projectile'&&
    Math.abs(projectile.x-f.x)<180&&
    Math.abs(projectile.y-(f.y-45))<85&&
    Math.sign(projectile.vx||0)===Math.sign(f.x-projectile.x));
  if (approachingProjectile && brain.hopReady <= 0 && Math.random()<defenseChance*.13) {
    command.up=true;
    brain.hopReady=2.2;
    brain.dodgeUntil=.25;
  }
  if (opponent.attack && d<115 && Math.random()<defenseChance*.16) {
    if (opponent.attack.kind==='punch') command.down=true;
    else if (brain.hopReady<=0) {command.up=true;brain.hopReady=2;}
    else command.block=true;
    brain.dodgeUntil=.22;
  }
  if (!command.up && !command.down && d<110 && Math.random()<defenseChance*.06)
    command.block=true;
  if (brain.dodgeUntil>0 && !command.up) command.block=true;

  if (f.id==='lapis' && f.magnet && d>260 && Math.random()<.07)
    command.doubleRight=true;
  if (f.id==='tori' && f.flying && f.pe<15) command.s1=true;

  f.aiTimer -= dt;
  if (f.aiTimer > 0 || f.recovery>.1 || f.stun>0) return command;
  f.aiTimer = reaction+rnd(0,reaction*.55);

  if (d<110&&!command.block) {
    const attackChance=difficulty==='hard'?.75:difficulty==='easy'?.37:.55;
    if (Math.random()<attackChance) command[Math.random()<.58?'punch':'kick']=true;
    else if(d<65&&Math.random()<.16)command.throw=true;
  }

  const profile = AI_PROFILES[f.id];
  const weights = profile?profile(d,f,opponent,g):[];
  const ready = f.c.skills.map((skill,index) => ({skill,index,weight:weights[index]||0}))
    .filter(({skill,index,weight}) => weight>0&&!skill.passive&&
      f.cd[index]<=0&&f.pe>=skill.cost);
  if (!ready.length) return command;
  const skillChance = difficulty==='hard'?.83:difficulty==='easy'?.44:.65;
  if (Math.random()>skillChance) return command;
  const sum=ready.reduce((s,c)=>s+c.weight,0);
  let roll=Math.random()*sum;
  for(const choice of ready){
    roll-=choice.weight;
    if(roll<=0){command['s'+(choice.index+1)]=true;break;}
  }
  return command;
};

<script>
'use strict';

// Inspired by the separate LapisOrbits/MetalClone classes from index(1).html:
// physical defenses now interact with incoming projectiles in the fight world.
// These interactions use the same entity and damage rules as the host engine.
const originalEntitiesStep = Fight.entitiesStep.bind(Fight);
Fight.entitiesStep = function(dt){
  const g=this.g;
  if(!g?.e?.length)return originalEntitiesStep(dt);
  const activeOrbits=g.e.filter(e=>e.kind==='orbit'&&e.life>0);
  const activeSummons=g.e.filter(e=>e.kind==='summon'&&e.life>0&&e.hp>0);
  const threats=g.e.filter(e=>e.kind==='projectile'&&e.life>0);

  for(const shot of threats){
    const projectedX=shot.x+shot.vx*dt;
    const projectedY=shot.y+(shot.vy||0)*dt;
    let intercepted=false;

    for(const orbit of activeOrbits){
      if(orbit.owner===shot.owner)continue;
      const fighter=g.f[orbit.owner];
      if(!fighter||fighter.hp<=0)continue;
      const count=orbit.count||2;
      for(let n=0;n<count;n++){
        const a=g.t*5+n*Math.PI*2/count;
        const x=fighter.x+Math.cos(a)*orbit.r;
        const y=fighter.y-45+Math.sin(a)*orbit.r*.55;
        if(Math.hypot(projectedX-x,projectedY-y)>14+(shot.r||10))continue;
        intercepted=true;
        this.spark(x,y,fighter.c.color,10);
        this.float('ОТРАЖЕНО',x,y-28,fighter.c.color);
        break;
      }
      if(intercepted)break;
    }

    if(!intercepted)for(const summoned of activeSummons){
      if(summoned.owner===shot.owner)continue;
      if(Math.abs(projectedX-summoned.x)>25+(shot.r||10)||
         Math.abs(projectedY-(summoned.y-48))>37+(shot.r||10))continue;
      summoned.hp=Math.max(0,summoned.hp-(shot.dmg||10));
      this.spark(projectedX,projectedY,summoned.color||'#a7c7d5',9);
      intercepted=true;
      break;
    }

    if(intercepted)shot.life=0;
  }
  return originalEntitiesStep(dt);
};
