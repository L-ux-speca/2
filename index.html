<script>
'use strict';

// Character-aware adaptation of the 14 original techniques to the ship arena.
// A small registry keeps a future character's RT moves outside the boss engine.
// Passive effects are never presented as activatable skills.
const RTAbility = {
  target(rt) { return rt.target(); },
  volley(rt,count,damage=7,spread=.09,speed=700) {
    for(let n=0;n<count;n++) rt.shoot(damage,(n-(count-1)/2)*spread,5,speed);
    rt.spark(rt.g.x,rt.g.y,rt.g.c.color,Math.min(20,count*3));
  },
  strike(rt,damage) {
    const t=this.target(rt);
    if (!t) return;
    rt.hitTarget(t,damage);
    rt.spark(t.x,t.y,rt.g.c.color,20);
  },
  shock(rt,radius=155,damage=0) {
    const g=rt.g;
    g.bullets=g.bullets.filter(b=>hypot(b.x-g.x,b.y-g.y)>radius);
    g.objects.push({kind:'pulse',x:g.x,y:g.y,r:radius,life:.38,full:.38});
    if(damage>0)for(const t of [...rt.targets()])
      if(hypot(t.x-g.x,t.y-g.y)<radius+35)rt.hitTarget(t,damage);
    rt.spark(g.x,g.y,g.c.color,24);
  },
  shield(rt,seconds=2.4){
    rt.g.shield=Math.max(rt.g.shield,seconds);
    rt.g.inv=Math.max(rt.g.inv,.2);
    rt.spark(rt.g.x,rt.g.y,'#a2f5ef',22);
  },
  heal(rt,amount){rt.g.hp=Math.min(rt.g.c.hp,rt.g.hp+amount);rt.spark(rt.g.x,rt.g.y,'#a3eab6',24);},
  effect(rt,kind,seconds,options={}){
    rt.g.activeAbilities??=[];
    rt.g.activeAbilities.push({kind,life:seconds,interval:options.interval||.4,
      timer:0,damage:options.damage||0,radius:options.radius||95,
      targetId:rt.target()?.id,originX:options.x??rt.g.x,
      originY:options.y??rt.g.y,shots:options.shots||1});
  },
  damageOverTime(rt,seconds,damagePerTick,interval=.4){
    this.effect(rt,'damage-over-time',seconds,{damage:damagePerTick,interval});
  },
  summon(rt,seconds=5,damage=6,shots=1){
    this.effect(rt,'summon',seconds,{damage,shots,interval:.72});
  },
  slowField(rt,seconds=4,radius=140){
    this.effect(rt,'magnet',seconds,{radius});
  },
  orbit(rt,seconds=3.4){
    this.effect(rt,'orbit',seconds,{radius:70,damage:5,interval:.7});
  }
};

const RT_SKILL_HANDLERS = Object.freeze({
  yuzuha: [
    rt=>RTAbility.strike(rt,20),
    rt=>RTAbility.damageOverTime(rt,1.8,4,.35),
    rt=>RTAbility.shield(rt,3)
  ],
  caesar: [
    rt=>RTAbility.volley(rt,7,4,.12,520),
    rt=>RTAbility.volley(rt,1,18,0,980),
    rt=>RTAbility.shield(rt,3.2)
  ],
  araya: [
    rt=>RTAbility.volley(rt,7,5,.14,590),
    rt=>{RTAbility.strike(rt,26);rt.g.inv=Math.max(rt.g.inv,.45);},
    rt=>RTAbility.shield(rt,3)
  ],
  lapis: [
    rt=>RTAbility.orbit(rt,3.4),
    rt=>RTAbility.strike(rt,25),
    rt=>RTAbility.slowField(rt,4.5,175)
  ],
  tori: [
    rt=>RTAbility.effect(rt,'flight',4.2,{radius:120}),
    rt=>RTAbility.volley(rt,1,18,0,740),
    rt=>{RTAbility.shock(rt,145,30);rt.g.inv=Math.max(rt.g.inv,.35);},
    rt=>RTAbility.heal(rt,30)
  ],
  akira: [
    rt=>RTAbility.damageOverTime(rt,2.0,5,.4),
    rt=>RTAbility.strike(rt,17),
    rt=>{RTAbility.volley(rt,2,7,.035,540);RTAbility.damageOverTime(rt,2,2,.5);}
  ],
  sonic: [
    rt=>{rt.g.hp=Math.max(1,rt.g.hp-20);RTAbility.effect(rt,'speed',6);},
    rt=>RTAbility.summon(rt,7,4,3),
    rt=>RTAbility.effect(rt,'blade',8,{damage:5,interval:.55})
  ],
  david: [
    rt=>RTAbility.effect(rt,'fist',5,{damage:5,interval:.65}),
    rt=>{RTAbility.volley(rt,1,25,0,520);RTAbility.damageOverTime(rt,3,3,.6);},
    rt=>RTAbility.damageOverTime(rt,7,4,1.4)
  ],
  chieko: [
    rt=>{RTAbility.shock(rt,155);RTAbility.volley(rt,1,2,0,450);},
    rt=>RTAbility.strike(rt,20),
    rt=>{RTAbility.shield(rt,2.4);RTAbility.effect(rt,'counter',2.4,{damage:9});},
    rt=>RTAbility.shock(rt,220,20)
  ],
  airi: [
    rt=>RTAbility.damageOverTime(rt,3,10,.95),
    rt=>RTAbility.summon(rt,8,5),
    rt=>RTAbility.damageOverTime(rt,3.2,12,1.05)
  ],
  dio: [
    rt=>{RTAbility.strike(rt,10);RTAbility.heal(rt,8);},
    rt=>{RTAbility.effect(rt,'counter',2,{damage:25});RTAbility.shield(rt,.5);},
    null // Last Chance activates on an otherwise lethal hit.
  ],
  kayano: [
    rt=>RTAbility.damageOverTime(rt,1.05,6,.18)
  ],
  mechamaru: [
    rt=>RTAbility.strike(rt,36),
    rt=>RTAbility.volley(rt,12,5,.06,660),
    rt=>{RTAbility.summon(rt,12,9,2);RTAbility.shield(rt,1.6);}
  ],
  kisei: [
    rt=>RTAbility.strike(rt,25),
    rt=>RTAbility.strike(rt,20),
    rt=>{RTAbility.volley(rt,1,18,0,540);RTAbility.damageOverTime(rt,3,3,.7);},
    rt=>RTAbility.effect(rt,'revolver',5,{damage:5,interval:.4})
  ]
});

RT.cast = function(index) {
  const g=this.g,skill=g?.c.skills[index];
  if(!g||!skill||skill.passive||g.state!=='active'||g.phaseWait>0||g.cd[index]>0)return;
  const revolverOn=g.c.id==='kisei'&&index===3&&g.activeAbilities?.some(e=>e.kind==='revolver'&&e.life>0);
  const cost=revolverOn?4:skill.cost;
  if(g.pe<cost&&!Cheats.energy)return;
  if(!Cheats.energy)g.pe-=cost;
  g.cd[index]=Cheats.cooldowns?0:revolverOn?.4:skill.cd;
  AudioSys.sfx('cast');
  this.announce(skill.name.toUpperCase());
  if(revolverOn){this.shoot(5,0,5,830);return;}
  const handler=RT_SKILL_HANDLERS[g.c.id]?.[index];
  if(handler)handler(this);
};

const originalRTStart = RT.start.bind(RT);
RT.start = function(...args){
  originalRTStart(...args);
  if(this.g){this.g.activeAbilities=[];this.g.lastDamageFromCounter=0;this.g.lastPhase=this.g.phase;}
};

const originalRTPhase = RT.phase.bind(RT);
RT.phase = function(n){
  originalRTPhase(n);
  if(this.g)this.g.activeAbilities=[];
};

const originalRTHitHero = RT.hitHero.bind(RT);
RT.hitHero = function(damage,options){
  const g=this.g;
  if(!g)return false;
  const before=g.hp;
  const landed=originalRTHitHero(damage,options);
  if(landed&&g.hp<before&&g.activeAbilities?.some(e=>e.kind==='counter')){
    RTAbility.strike(this,Math.min(25,damage*2));
  }
  if(g.hp<=0&&g.c.id==='dio'&&!g.lastChanceUsed&&g.pe>=30){
    g.pe-=30;g.hp=Math.min(g.c.hp,30);g.inv=1;g.lastChanceUsed=true;
    this.announce('ПОСЛЕДНИЙ ШАНС');
    this.spark(g.x,g.y,'#f4d883',30);
  }
  return landed;
};

const originalRTStep = RT.step.bind(RT);
RT.step = function(dt){
  originalRTStep(dt);
  const g=this.g;
  if(!g||App.paused||g.state!=='active'||g.phaseWait>0||!g.activeAbilities?.length)return;
  for(const effect of g.activeAbilities){
    effect.life-=dt;
    effect.timer-=dt;
    if(effect.kind==='orbit'){
      g.bullets=g.bullets.filter(b=>hypot(b.x-g.x,b.y-g.y)>effect.radius);
    } else if(effect.kind==='magnet'){
      // A local Lorentz field bends hostile trajectories; no blood-iron control.
      for(const b of g.bullets){
        if(hypot(b.x-g.x,b.y-g.y)>effect.radius||b._magnetized)continue;
        b.vx*=.62;b.vy*=.62;b._magnetized=true;
      }
    } else if(effect.kind==='flight'){
      g.x=clamp(g.x+g.dx*85*dt,24,936);
      g.y=clamp(g.y+g.dy*85*dt,110,572);
    } else if(effect.kind==='speed'){
      g.shootTimer=Math.min(g.shootTimer,.045);
    }

    if(effect.timer>0)continue;
    effect.timer+=effect.interval;
    if(effect.kind==='damage-over-time'){
      const target=g.targets.find(t=>t.id===effect.targetId&&t.hp>0)||this.target();
      if(target)this.hitTarget(target,effect.damage);
    } else if(effect.kind==='summon'){
      for(let i=0;i<effect.shots;i++)this.shoot(effect.damage,(i-(effect.shots-1)/2)*.11,5,690);
    } else if(effect.kind==='orbit'||effect.kind==='blade'||effect.kind==='fist'){
      this.shoot(effect.damage,0,5,730);
    }
    if(g.state!=='active')break;
  }
  g.activeAbilities=g.activeAbilities.filter(effect=>effect.life>0);
};

const originalRTDraw = RT.draw.bind(RT);
RT.draw = function(){
  originalRTDraw();
  const g=this.g,c=App.ctx;
  if(!g||!c||!g.activeAbilities?.length)return;
  c.save();
  for(const effect of g.activeAbilities){
    if(effect.kind==='orbit'){
      c.strokeStyle='#8edff2';c.lineWidth=2;
      c.beginPath();c.arc(g.x,g.y,effect.radius,0,Math.PI*2);c.stroke();
      for(let i=0;i<2;i++){
        const a=g.t*5+i*Math.PI;
        c.fillStyle='#99dfe8';c.beginPath();
        c.arc(g.x+Math.cos(a)*effect.radius,g.y+Math.sin(a)*effect.radius,12,0,Math.PI*2);c.fill();
      }
    }else if(effect.kind==='magnet'){
      c.strokeStyle='#58e4fa88';c.lineWidth=2;c.setLineDash([10,7]);
      c.beginPath();c.arc(g.x,g.y,effect.radius,0,Math.PI*2);c.stroke();c.setLineDash([]);
    }else if(effect.kind==='summon'){
      c.fillStyle=g.c.color;c.fillRect(g.x-53,g.y-28,14,19);
      c.strokeStyle='#fff7';c.strokeRect(g.x-53,g.y-28,14,19);
    }
  }
  c.restore();
};

// Accessible metadata for adding other characters or future RT controllers.
window.RTAbilityRegistry = Object.freeze({handlers:RT_SKILL_HANDLERS,helpers:RTAbility});

</script>
<script>
'use strict';

// Gameplay and presentation fixes. Loaded after the character and RT adapters.
// Keep these overrides together until the corresponding core modules are refactored.
(() => {
  const key = (player, action) => keyLabel(Keys[player][action]);
  const join = (player, ...actions) => actions.map(action => key(player, action)).join(' / ');
  const controlHelp = () => {
    const listing = (player) => [
      ['Движение', join(player, 'left', 'right')],
      ['Прыжок / присед', join(player, 'up', 'down')],
      ['Удар рукой / ногой', join(player, 'punch', 'kick')],
      ['Блок / бросок', join(player, 'block', 'throw')],
      ['Техники', join(player, 's1', 's2', 's3', 's4')],
      ['Добивание', key(player, 'finish')]
    ].map(([title, keys]) => `<p><span>${title}</span><kbd>${esc(keys)}</kbd></p>`).join('');
    return `<div class="two-cols">
      <section><div class="eyebrow">Игрок 1 · файтинг</div><div class="help-table" style="grid-template-columns:1fr">${listing(0)}</div></section>
      <section><div class="eyebrow">Игрок 2 · файтинг</div><div class="help-table" style="grid-template-columns:1fr">${listing(1)}</div></section>
    </div><div class="section-line"></div>
    <div class="eyebrow">РТ Араи</div><div class="help-table">
      <p><span>Движение</span><kbd>${esc(join(0, 'left', 'right', 'up', 'down'))}</kbd></p>
      <p><span>Смена цели</span><kbd>Q</kbd></p>
      <p><span>Рывок</span><kbd>Shift / двойное направление</kbd></p>
      <p><span>Техники</span><kbd>${esc(join(0, 's1', 's2', 's3', 's4'))}</kbd></p>
      <p><span>Авторские приёмы</span><kbd>Shift + 1–6</kbd></p>
      <p><span>Пауза</span><kbd>Esc</kbd></p>
    </div><p class="help-note">В РТ нет обычного автоогня: урон наносят техники и созданные приёмы. Уклонения вблизи пуль пополняют шкалу АТАКИ и ускоряют откат первого приёма. Клавиши Q, Shift, Esc и Shift + 1–6 пока фиксированы.</p>`;
  };

  App.help = function() {
    if (['fight', 'rt'].includes(this.screen) && Fight.g?.mode !== 'online') {
      this.paused = true;
      AudioSys.pause();
    }
    this.modalBox('Как играть', controlHelp(), true);
  };

  const originalSelect = App.drawSelect.bind(App);
  App.drawSelect = function() {
    originalSelect();
    const controls = document.querySelector('.select-footer .control-hint');
    if (controls) controls.innerHTML = `<kbd>${esc(key(0, 'left'))}</kbd><kbd>${esc(key(0, 'right'))}</kbd> движение · <kbd>${esc(key(0, 'up'))}</kbd> прыжок · <kbd>${esc(key(0, 'block'))}</kbd> блок<br><kbd>${esc(key(0, 'punch'))}</kbd><kbd>${esc(key(0, 'kick'))}</kbd> удары · <kbd>${esc(join(0, 's1', 's2', 's3', 's4'))}</kbd> техники`;
    const rtDifficulty = [...document.querySelectorAll('.settings-grid .field')]
      .find(field => field.querySelector('label')?.textContent.includes('СЛОЖНОСТЬ РТ'));
    if (rtDifficulty && !(this.config.mode === 'cpu' && this.config.p2 === 'araya')) rtDifficulty.remove();
    for (const side of [0, 1]) {
      const id = this.config[`p${side + 1}`];
      const hp = this.config.rules.includes('last_chance') ? 1 :
        char(id).hp * (this.config.rules.includes('half_hp') ? .5 : 1);
      const card = document.querySelector(`.char-card[onclick="App.pickChar('${id}')"] .cc-copy small`);
      if (card) card.textContent = `${hp} HP / ${char(id).pe} ПЭ`;
    }
    const fighterInfo = document.querySelector('.select-info .stats b');
    if (fighterInfo) fighterInfo.textContent = this.config.rules.includes('last_chance') ? 1 :
      char(this.config[`p${this.selectionSide + 1}`]).hp * (this.config.rules.includes('half_hp') ? .5 : 1);
  };

  const originalGameUI = App.gameUI.bind(App);
  App.gameUI = function(rt = false) {
    originalGameUI(rt);
    const controls = document.querySelector('.combat-footer .control-hint');
    if (controls) controls.innerHTML = rt ?
      `${esc(join(0, 'left', 'right', 'up', 'down'))} · движение<br>Q · цель &nbsp; Shift · рывок &nbsp; ${esc(join(0, 's1', 's2', 's3', 's4'))} · техники` :
      `${esc(join(0, 'punch', 'kick'))} · удары &nbsp; ${esc(key(0, 'block'))} · блок &nbsp; ${esc(key(0, 'throw'))} · бросок<br>Shift + 1…6 · свои приёмы`;
    if (rt) {
      document.querySelector('[data-act="fire"]')?.remove();
    }
  };

  const originalHome = App.home.bind(App);
  App.home = function() {
    if (this._builderTrial && this.screen === 'fight' && Fight.g?.mode === 'training') {
      this._builderTrial = false;
      Builder.open(Builder.hero);
      return;
    }
    this._builderTrial = false;
    originalHome();
    document.querySelector('#homeArt')?.remove();
    document.querySelector('.hero-number')?.remove();
  };

  const originalBuilderTest = Builder.test.bind(Builder);
  Builder.test = function() {
    originalBuilderTest();
    if (App.screen === 'fight' && Fight.g?.mode === 'training') App._builderTrial = true;
  };

  // The original core generated one ostinato at three tempos. These are
  // different melodic/rhythmic arrangements, plus a true silent selection.
  AudioSys.tick = function(dt) {
    if (this.custom) { this.custom.volume = Pref.master * Pref.music; return; }
    if (Pref.style === 'off' || Pref.music <= 0) return;
    this.clock -= dt;
    if (this.clock > 0) return;
    const tracks = {
      forge: {bpm: 118, root: 65.4, melody: [0, 0, 7, 10, 0, 3, 7, 12], type: 'triangle'},
      blood: {bpm: 142, root: 55, melody: [0, 3, 0, -2, 7, 6, 3, -5, 0, 12, 10, 7, 3, 0, -2, -5], type: 'sawtooth'},
      moon: {bpm: 78, root: 98, melody: [0, 7, 12, 9, 5, 12, 7, 2, 0, 4, 9, 12], type: 'sine'}
    };
    const track = tracks[Pref.style] || tracks.forge;
    this.clock = 60 / track.bpm / (Pref.style === 'moon' ? 1 : 2);
    const beat = this.beat++;
    const note = track.melody[beat % track.melody.length];
    this.tone(track.root * 2 ** (note / 12), Pref.style === 'moon' ? .62 : .24, track.type, .09, true);
    if (Pref.style === 'blood' && beat % 4 === 0) {
      this.tone(track.root * .5, .38, 'sawtooth', .11, true);
      this.tone(track.root * 2, .055, 'square', .035, true);
    } else if (Pref.style === 'forge' && beat % 2 === 0) {
      this.tone(track.root * .5, .18, 'sine', .17, true);
    } else if (Pref.style === 'moon' && beat % 3 === 0) {
      this.tone(track.root * .75, .88, 'sine', .055, true);
    }
  };
  AudioSys.clearCustom = function() {
    if (this.custom) { this.custom.pause(); this.custom.removeAttribute('src'); this.custom.load(); }
    if (this.customURL) URL.revokeObjectURL(this.customURL);
    this.customURL = null;
    this.custom = null;
    this.clock = 0;
    this.beat = 0;
    toast('Своя музыка убрана');
  };
  const originalLoadMusic = AudioSys.load.bind(AudioSys);
  AudioSys.load = function(file) {
    this.custom?.pause();
    return originalLoadMusic(file);
  };
  // The original preferences validator predates the silent option.
  if (readStore('clash-pref-v9', {}).style === 'off') Pref.style = 'off';
  const originalSettings = App.settings.bind(App);
  App.settings = function(tab) {
    originalSettings(tab);
    if (tab === 'keys') return;
    const musicSelect = [...document.querySelectorAll('#modalRoot select')]
      .find(sel => [...sel.options].some(option => option.value === 'forge'));
    if (musicSelect) {
      const names = {forge: 'Кузница · ритмическая', blood: 'Кровь · напряжённая', moon: 'Луна · атмосферная'};
      for (const option of musicSelect.options) option.textContent = names[option.value] || option.textContent;
      const silence = document.createElement('option');
      silence.value = 'off'; silence.textContent = 'Ничего · без музыки';
      musicSelect.append(silence);
      musicSelect.value = Pref.style;
    }
    const customInput = document.querySelector('#modalRoot input[type="file"][accept="audio/*"]');
    if (customInput) {
      const button = document.createElement('button');
      button.textContent = 'Убрать свою музыку';
      button.className = 'ghost';
      button.style.marginTop = '8px';
      button.disabled = !AudioSys.custom;
      button.addEventListener('click', () => { AudioSys.clearCustom(); button.disabled = true; customInput.value = ''; });
      customInput.addEventListener('change', () => { if (customInput.files?.length) button.disabled = false; });
      customInput.closest('label')?.after(button);
    }
    document.querySelector('#modalRoot input[onchange*="Pref.autoFire"]')?.closest('label')?.remove();
  };

  const originalRTSelect = App.rtSelect.bind(App);
  App.rtSelect = function() {
    originalRTSelect();
    const explanation = document.querySelector('#modalRoot p.muted');
    if (explanation) explanation.textContent = 'Три фазы: флот, эскорт и разрушаемые узлы. Применяй техники своего персонажа, переключай цели и уклоняйся от залпов.';
    const notes = document.querySelector('#modalRoot .hintbox');
    if (notes) notes.textContent = `${join(0, 'left', 'right', 'up', 'down')} — движение · Q — цель · Shift или двойное направление — рывок. Приёмы ${join(0, 's1', 's2', 's3', 's4')} наносят урон. Обычная стрельба отключена.`;
  };

  // Track PE spent at the moment it is actually consumed, across all skill types.
  function trackEnergy(actor, record, state) {
    let pe = actor.pe;
    Object.defineProperty(actor, 'pe', {
      configurable: true, enumerable: true,
      get() { return pe; },
      set(next) {
        if (!Number.isFinite(next)) return;
        if (next < pe && state()) record(pe - next);
        pe = next;
      }
    });
  }
  const originalMakeF = Fight.makeF.bind(Fight);
  Fight.makeF = function(id, side) {
    const f = originalMakeF(id, side);
    if (side === 0) trackEnergy(f, used => {
      this.g.stats.peSpent = (this.g.stats.peSpent || 0) + used;
    }, () => this.g?.state === 'active' && !Cheats.energy);
    return f;
  };

  const originalKO = Fight.ko.bind(Fight);
  Fight.ko = function(winner, skip = false) {
    originalKO(winner, skip);
    const g = this.g;
    if (!skip && g.state === 'ko' && winner !== null && ['cpu', 'arcade', 'survival'].includes(g.mode)) {
      this.finisher();
    } else if (!skip && g.state === 'ko' && winner !== null) {
      App.announce('НОКАУТ', `${g.f[winner].c.name} · ${key(winner, 'finish')} — добивание`);
    }
  };

  const originalRecord = Fight.record.bind(Fight);
  Fight.record = function() {
    originalRecord();
    if (this.g?.training?.recording)
      toast(`5 секунд записи манекена: клавиши игрока 2 — ${join(1, 'left', 'right', 'up', 'down', 'punch', 'kick')}`);
  };

  const originalAttack = Fight.attack.bind(Fight);
  Fight.attack = function(f, kind) {
    if (kind !== 'throw') return originalAttack(f, kind);
    if (f.stun > 0 || f.recovery > 0 || f.flying) return;
    const enemy = this.g.f[1 - f.side];
    const dx = enemy.x - f.x;
    if (Math.abs(dx) <= 115 && Math.abs(enemy.y - f.y) <= 65) {
      f.face = Math.sign(dx) || f.face;
      f.x += f.face * Math.min(22, Math.max(0, Math.abs(dx) - 44));
      const landed = this.damage(enemy, 14, f, {unblockable: true, kb: 270, stun: .24});
      f.recovery = .64; f.pose = .42;
      if (landed) { enemy.kx = f.face * 340; this.float('БРОСОК', enemy.x, enemy.y - 124, '#ffdaa3'); }
      else this.float('УКЛОНЕНИЕ', enemy.x, enemy.y - 112, '#b2cada');
      return;
    }
    f.pose = .22; f.recovery = .27;
    this.float('МИМО', f.x, f.y - 119, '#b2cada');
  };

  // After the final round the result screen is no longer an active battle.
  const originalResult = App.result.bind(App);
  App.result = function(title, sub, stats, action) {
    const fight = this.screen === 'fight' ? Fight.g : null;
    const rt = this.screen === 'rt' ? RT.g : null;
    const lived = fight?.t ?? rt?.t ?? 0;
    if (fight || rt) {
      const damage = fight?.stats.damage ?? rt?.damage ?? 0;
      const spent = fight?.stats.peSpent ?? rt?.peSpent ?? 0;
      stats += ` · Нанесено ${Math.round(damage)} урона · Время ${Math.round(lived)} с · Потрачено ${Math.round(spent)} ПЭ`;
    }
    originalResult(title, sub, stats, action);
    this.screen = 'result';
    this.paused = true;
  };
  const originalCloseModal = App.closeModal.bind(App);
  App.closeModal = function() {
    if (this.screen === 'result') { this.home(); return; }
    originalCloseModal();
  };
})();

</script>
<script>
'use strict';

(() => {
  // The templates are interpretations of established moves, not copies of
  // another fighter's complete technique or a way to bypass their palette.
  const TEMPLATES = Object.freeze([
    {id:'lapis_rail', name:'Ляпис · рельсотрон', type:'projectile', form:'rail', power:5, range:5, size:1, count:1},
    {id:'caesar_bubble', name:'Цезарь · пузырьковая пушка', type:'projectile', form:'bubble', power:3, range:4, size:3, count:2},
    {id:'akira_blood', name:'Акира · кровавый поток', type:'projectile', form:'blood', power:3, range:4, size:2, count:2},
    {id:'araya_cannon', name:'Арая · залп пушек', type:'projectile', form:'cannon', power:3, range:4, size:2, count:3},
    {id:'airi_spike', name:'Айри · металлические шипы', type:'projectile', form:'spike', power:3, range:4, size:2, count:3},
    {id:'chieko_tornado', name:'Чиэко · торнадо', type:'projectile', form:'tornado', power:2, range:3, size:4, count:1},
    {id:'kisei_ankh', name:'Кисей · огненный анх', type:'projectile', form:'ankh', power:3, range:4, size:2, count:1},
    {id:'sonic_clones', name:'Соник · клоны', type:'summon', form:'clone', power:3, range:2, size:2, duration:4, count:1},
    {id:'mechamaru_robot', name:'Мехамару · кукла', type:'summon', form:'robot', power:3, range:2, size:3, duration:4, count:1},
    {id:'david_trap', name:'Дэвид · токсичная среда', type:'field', form:'toxic', power:3, range:3, size:3, duration:4, count:1},
    {id:'yuzuha_vine', name:'Юзуха · щупальце', type:'pulse', form:'tentacle', power:4, range:2, size:3, count:1},
    {id:'kayano_meteor', name:'Каяно · метеор-комбинация', type:'pulse', form:'meteor', power:5, range:2, size:2, count:1}
  ]);
  const FORMS_BY_TYPE = Object.freeze({
    projectile: {generic:'Обычный',rail:'Рельсотрон',bubble:'Пузырь',blood:'Кровь',cannon:'Ядро',spike:'Металлический шип',tornado:'Торнадо',ankh:'Огненный анх'},
    pulse: {generic:'Импульс',tentacle:'Щупальце',meteor:'Метеор',wave:'Волна'},
    field: {generic:'Поле',toxic:'Токсичная зона',blood:'Кровавое поле'},
    summon: {generic:'Призыв',clone:'Клон',robot:'Механическая кукла'},
    shield: {generic:'Барьер',metal:'Металлический щит'},
    orbit: {generic:'Орбиты',metal:'Металлические орбиты'},
    dash: {generic:'Рывок',sonic:'Сверхскоростной рывок'},
    heal: {generic:'Лечение'}
  });
  FORMS.clone = 'Клон Соника';
  FORMS.robot = 'Кукла Мехамару';
  const originalNormalize = Builder.normalize.bind(Builder);
  Builder.normalize = function(character, move) {
    const result = originalNormalize(character, move);
    if (!result) return null;
    const sortedSteps = [...move.steps].sort((a, b) => (a.at || 0) - (b.at || 0));
    result.steps.forEach((step, index) => {
      const requested = sortedSteps[index]?.form;
      if (step.type === 'summon' && character.id === 'kisei' && Object.hasOwn(FORMS, requested)) {
        step.form = requested;
      } else if (Object.hasOwn(FORMS_BY_TYPE[step.type] || {}, requested)) {
        step.form = requested;
      }
    });
    return result;
  };

  Builder.applyTemplate = function(id) {
    const source = TEMPLATES.find(template => template.id === id);
    if (!source || !char(this.hero).palette.split(' ').includes(source.type)) {
      toast('Эта форма недоступна технике выбранного персонажа');
      return;
    }
    this.name = source.name;
    this.steps = [{type:source.type,at:0,power:source.power,range:source.range ?? 1,
      size:source.size ?? 1,duration:source.duration ?? 1,count:source.count ?? 1,
      aim:'forward',condition:'always',form:source.form}];
    // Power budget and PE limitations still apply to the selected fighter.
    while (this.price(char(this.hero), this.steps).budget > 70 ||
           this.price(char(this.hero), this.steps).cost > char(this.hero).pe) {
      const step = this.steps[0];
      if (step.count > 1) step.count--;
      else if (step.power > 1) step.power--;
      else if (step.range > 1) step.range--;
      else { toast('Этот образец слишком дорог для персонажа'); return; }
    }
    this.draw();
    toast('Образец загружен: параметры можно изменить');
  };

  const originalDraw = Builder.draw.bind(Builder);
  Builder.draw = function() {
    originalDraw();
    const steps = document.querySelector('#steps');
    if (!steps) return;
    const available = TEMPLATES.filter(template => char(this.hero).palette.split(' ').includes(template.type));
    const section = document.createElement('div');
    section.className = 'field';
    section.innerHTML = `<label>ОБРАЗЦЫ ПРИЁМОВ ДРУГИХ ПЕРСОНАЖЕЙ</label>
      <div class="row"><select id="move-template-picker" aria-label="Выбери образец">
      ${available.map(template => `<option value="${template.id}">${esc(template.name)}</option>`).join('')}
      </select><button type="button" class="ghost" id="apply-move-template">Применить</button></div>
      <small>Форма и базовые параметры сохраняют ограничения мощности и палитры.</small>`;
    steps.before(section);
    section.querySelector('#apply-move-template').addEventListener('click', () =>
      this.applyTemplate(section.querySelector('#move-template-picker').value));

    [...steps.querySelectorAll('.step-card')].forEach((card, index) => {
      const step = this.steps[index], styles = FORMS_BY_TYPE[step.type];
      if (!styles || (step.type === 'summon' && this.hero === 'kisei')) return;
      const field = document.createElement('div');
      field.className = 'field visual-form';
      field.innerHTML = `<label>Форма готового приёма</label><select aria-label="Форма приёма">
        ${Object.entries(styles).map(([id, name]) => `<option value="${id}" ${step.form === id ? 'selected' : ''}>${esc(name)}</option>`).join('')}
      </select>`;
      card.append(field);
      field.querySelector('select').addEventListener('change', event => this.change(index, 'form', event.target.value));
    });
  };

  // Apply the authored appearance to all immediate primitive effect calls.
  const originalProjectile = Fight.projectile.bind(Fight);
  Fight.projectile = function(f, data = {}) {
    const shape = this._customForm;
    if (!shape || shape === 'generic') return originalProjectile(f, data);
    const modified = {...data, shape};
    if (shape === 'rail') {
      modified.vx = (data.vx ?? f.face * 540) * 1.45;
      modified.r = Math.min(data.r ?? 10, 8);
    }
    if (shape === 'spike') modified.r = Math.max(9, data.r || 9);
    if (shape === 'blood') modified.bleed = 3 + (data.dmg || 0) * .12;
    if (shape === 'tornado') modified.stun = .5;
    if (shape === 'ankh') modified.burn = true;
    if (shape === 'bubble') modified.kb = 190;
    if (shape === 'cannon') modified.kb = 260;
    return originalProjectile(f, modified);
  };
  const originalArea = Fight.area.bind(Fight);
  Fight.area = function(f, data = {}) {
    return originalArea(f, this._customForm && this._customForm !== 'generic' ? {...data, shape:this._customForm} : data);
  };
  const originalSummon = Fight.summon.bind(Fight);
  Fight.summon = function(f, data = {}) {
    return originalSummon(f, ['clone','robot'].includes(this._customForm) ? {...data, shape:this._customForm} : data);
  };
  const originalEntity = Fight.entity.bind(Fight);
  Fight.entity = function(f, data) {
    if (this._customForm && this._customForm !== 'generic' && data.kind === 'trap') {
      const modified = {...data, shape:this._customForm};
      if (this._customForm === 'toxic') modified.poison = true;
      if (this._customForm === 'blood') modified.bleed = 4;
      return originalEntity(f, modified);
    }
    return originalEntity(f, data);
  };

  const originalDrawEntity = Fight.drawEntity.bind(Fight);
  Fight.drawEntity = function(ctx, entity) {
    originalDrawEntity(ctx, entity);
    const kind = entity.shape;
    if (!['blood','cannon','toxic','meteor'].includes(kind)) return;
    ctx.save();
    const x = entity.x, y = entity.y, r = entity.r || 15;
    if (kind === 'blood') {
      ctx.strokeStyle = '#ec516f'; ctx.lineWidth = Math.max(3, r * .5);
      ctx.beginPath(); ctx.moveTo(x - (entity.vx || 0) * .032, y + 2);
      ctx.quadraticCurveTo(x - r, y - r * .45, x, y); ctx.stroke();
    } else if (kind === 'cannon') {
      ctx.fillStyle = '#343943'; ctx.strokeStyle = '#f4ce95'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(x, y, Math.min(22, r), 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    } else if (kind === 'toxic') {
      ctx.fillStyle = '#b1e27b55'; ctx.strokeStyle = '#cef49f'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(x, y, r, Math.max(6, r * .15), 0, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
    } else if (kind === 'meteor') {
      ctx.strokeStyle = '#ffd080'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(x, y, r * .65, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.restore();
  };

  const originalCustomStep = Fight.customStep.bind(Fight);
  Fight.customStep = function(f, step) {
    const power = 1 + (step.power - 1) * 1.75;
    const range = 1 + (step.range - 1) * 1.4;
    const boosted = {...step, power, range};
    if (step.type === 'dash') {
      // Velocity is exponentially damped (9 / s) by the physics engine;
      // the old 700 px/s maximum yielded <80 px of extra travel.
      const impulse = 480 + range * 255 + power * 105;
      f.kx = f.face * impulse;
      f.st.inv = Math.max(f.st.inv || 0, .12 + step.power * .045);
      this.spark(f.x, f.y - 52, f.c.color, 15);
      return;
    }
    if (step.type === 'summon' && f.id === 'kisei' && ['clone','robot'].includes(step.form)) {
      this.summon(f, {life:1 + step.duration, hp:6 + power * 5,
        shape:step.form, dmg:2 + power});
      return;
    }
    this._customForm = step.form || 'generic';
    try {
      if (step.type === 'projectile' && step.form === 'spike') {
        const count = step.count || 1;
        for (let i = 0; i < count; i++) this.projectile(f, {
          x:f.x + f.face * 44, y:f.y - 24 - i * 25,
          vx:f.face * (480 + range * 68), dmg:5 + power * 3,
          r:8 + step.size * 2, level:i===0?'low':'high', life:1.8
        });
      } else originalCustomStep(f, boosted);
    } finally {
      this._customForm = null;
    }
  };

  function beginSpecial(f, index, engine) {
    const skill = f.c.skills[index];
    if (!skill || !engine.canCast(f, index, skill.cost)) return false;
    if (!engine.rule('unlimited_pe') && !engine.cheat(f, 'energy')) f.pe -= skill.cost;
    f.cd[index] = skill.cd * (engine.rule('quick_skills') ? .5 : 1);
    f.pose = .35;
    AudioSys.sfx('cast');
    engine.spark(f.x, f.y - 52, f.c.color, 12);
    return true;
  }

  const originalCast = Fight.cast.bind(Fight);
  Fight.cast = function(f, index) {
    if (f.id === 'airi' && index === 2) {
      if (!beginSpecial(f, index, this)) return false;
      f.recovery = .42;
      // Three steel spikes originate at Airi, not at the opponent's feet.
      for (let height = 0; height < 3; height++) {
        const h = height;
        this.queue(f, height * .12, () => this.projectile(f, {
          x:f.x + f.face * 48, y:f.y - 23 - h * 26,
          vx:f.face * 680, dmg:12, r:13, life:2,
          shape:'spike', level:h===0?'low':'high', kb:135
        }), true);
      }
      return true;
    }
    if (f.id === 'kayano' && index === 0) {
      if (!beginSpecial(f, index, this)) return false;
      const comboPower = clamp(1 + f.comboPoints * .35, 1, 2.75);
      f.recovery = 1.15;
      for (let hit = 0; hit < 5; hit++) this.queue(f, .09 + hit * .17, () => {
        const enemy = this.g.f[1 - f.side], distance = enemy.x - f.x;
        f.face = Math.sign(distance) || f.face;
        if (Math.abs(distance) > 185 || Math.abs(enemy.y - f.y) > 90) return;
        f.x = clamp(f.x + f.face * Math.min(30, Math.max(0, Math.abs(distance) - 47)), 28, 1072);
        f.pose = .18;
        this.area(f, {x:f.x + f.face * 52, y:f.y - 53, r:70,
          dmg:5 * comboPower, kb:hit === 4 ? 270 : 45, life:.14, shape:'meteor'});
        this.spark(f.x + f.face * 55, f.y - 53, f.c.color, 6);
      }, true);
      return true;
    }
    const success = originalCast(f, index);
    if (success && this.g.mode === 'cpu' && f.side === 1 && f.id === 'david') {
      f.cd[index] *= 1.55; // No hidden fast-cooldown advantage for David's AI.
      f.aiTimer = Math.max(f.aiTimer, .6);
    }
    return success;
  };

  // Advancing an arcade/survival stage should dismiss the result without
  // invoking the result screen's 'X means return to menu' behavior.
  const originalNextStage = Fight.nextStage.bind(Fight);
  Fight.nextStage = function() {
    if (App.screen === 'result') App.screen = 'fight';
    return originalNextStage();
  };

  window.ClashMoveTemplates = TEMPLATES;
})();

</script>
<script>
'use strict';

(() => {
  // Standard shots formerly made the player a generic gunship. Every call
  // with explicit damage/parameters is an actual hero or authored technique.
  const shootTechnique = RT.shoot.bind(RT);
  RT.shoot = function(...args) {
    if (args.length === 0) return; // Remove automatic / Space gunfire.
    return shootTechnique(...args);
  };

  // Boss durability was balanced for ~15 free shots/s. With only techniques,
  // damage must be appreciably higher to keep all three phases winnable.
  const originalHitTarget = RT.hitTarget.bind(RT);
  RT.hitTarget = function(target, amount) {
    return originalHitTarget(target, amount * 2.35);
  };

  function trackRTPE(g) {
    let pe = g.pe;
    Object.defineProperty(g, 'pe', {
      configurable: true, enumerable: true,
      get() { return pe; },
      set(next) {
        if (!Number.isFinite(next)) return;
        if (next < pe && g.state === 'active' && !Cheats.energy)
          g.peSpent += pe - next;
        pe = next;
      }
    });
  }

  const originalStart = RT.start.bind(RT);
  RT.start = function(...args) {
    originalStart(...args);
    if (this.g) {
      this.g.visualTraces = [];
      this.g.peSpent = 0;
      trackRTPE(this.g);
    }
  };

  // Skill damage is dealt by the character's ability, and the trajectory is
  // visibly communicated instead of being an invisible instant HP change.
  const originalCast = RT.cast.bind(RT);
  RT.cast = function(index) {
    const g = this.g, skill = g?.c.skills[index];
    if (!g || !skill || skill.passive || g.state !== 'active' || g.phaseWait > 0 || g.cd[index] > 0) return;
    const revolverOn = g.c.id === 'kisei' && index === 3 &&
      g.activeAbilities?.some(effect => effect.kind === 'revolver' && effect.life > 0);
    if (g.pe < (revolverOn ? 4 : skill.cost) && !Cheats.energy) return;
    const target = this.target();
    originalCast(index);
    g.visualTraces ??= [];
    if (g.c.id === 'lapis' && index === 1 && target) {
      g.visualTraces.push({kind:'rail',targetId:target.id,x:g.x,y:g.y,
        toX:target.x,toY:target.y,expires:g.t+.31,started:g.t,color:'#bceffc'});
      this.spark(target.x, target.y, '#dcfaff', 24);
    }
    if (g.c.id === 'akira' && index <= 1 && target) {
      g.visualTraces.push({kind:'blood',targetId:target.id,x:g.x,y:g.y,
        toX:target.x,toY:target.y,expires:g.t+(index===0?2.1:.5),started:g.t,color:'#fb5a7b'});
      this.spark(g.x, g.y, '#df4166', 12);
    }
  };

  const originalStep = RT.step.bind(RT);
  RT.step = function(dt) {
    originalStep(dt);
    const g = this.g;
    if (!g) return;
    g.visualTraces = (g.visualTraces || []).filter(trace => trace.expires > g.t);
    if (g.state !== 'active' || App.paused) return;
    // Sonic's self-accelerating technique previously only made free gunfire
    // faster; after removing basic shots it now increases mobility directly.
    if (g.activeAbilities?.some(effect => effect.kind === 'speed' && effect.life > 0)) {
      g.x = clamp(g.x + g.dx * dt * 160, 24, 936);
      g.y = clamp(g.y + g.dy * dt * 160, 110, 572);
    }
  };

  const originalDraw = RT.draw.bind(RT);
  RT.draw = function() {
    originalDraw();
    const g = this.g, ctx = App.ctx;
    if (!g || !ctx || !g.visualTraces?.length) return;
    ctx.save();
    for (const trace of g.visualTraces) {
      const target = g.targets.find(t => t.id === trace.targetId && t.hp > 0);
      const endX = target?.x ?? trace.toX;
      const endY = target?.y ?? trace.toY;
      const remaining = Math.max(0, trace.expires - g.t);
      const life = trace.expires - trace.started;
      ctx.globalAlpha = Math.min(1, remaining / .2);
      if (trace.kind === 'rail') {
        ctx.strokeStyle = '#bceffc'; ctx.lineWidth = 12 * remaining / life + 2;
        ctx.shadowColor = '#71dbff'; ctx.shadowBlur = 24;
        ctx.beginPath(); ctx.moveTo(trace.x, trace.y); ctx.lineTo(endX, endY); ctx.stroke();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(trace.x, trace.y); ctx.lineTo(endX, endY); ctx.stroke();
      } else if (trace.kind === 'blood') {
        ctx.shadowColor = '#ff335a'; ctx.shadowBlur = 12; ctx.strokeStyle = '#d63f62';
        ctx.lineWidth = 6 + Math.sin(g.t * 22) * 2;
        ctx.beginPath(); ctx.moveTo(g.x, g.y);
        const bend = Math.sin(g.t * 10) * 35;
        ctx.bezierCurveTo((g.x + endX) / 2, g.y + bend,
          (g.x + endX) / 2, endY - bend, endX, endY);
        ctx.stroke();
      }
    }
    ctx.restore();
  };

  const originalPhase = RT.phase.bind(RT);
  RT.phase = function(...args) {
    originalPhase(...args);
    if (this.g) this.g.visualTraces = [];
  };

  const originalReturn = RT.returnResult.bind(RT);
  RT.returnResult = function(won) {
    const g = this.g;
    if (g && !g.test && Fight.g?.stats) {
      Fight.g.stats.peSpent = (Fight.g.stats.peSpent || 0) + (g.peSpent || 0);
      Fight.g.stats.damage += g.damage || 0;
      Fight.g.t += g.t;
    }
    originalReturn(won);
  };

  const originalCustomStep = RT.customStep.bind(RT);
  RT.customStep = function(step) {
    return originalCustomStep({...step,
      power:1 + (step.power - 1) * 1.75,
      range:1 + (step.range - 1) * 1.4});
  };
})();

</script>
<script>
// Combat-feel pass: responsive chains, real defensive timing, and readable contact.
(() => {
  const createFighter = Fight.makeF.bind(Fight);
  Fight.makeF = function(id, side) {
    const f = createFighter(id, side);
    f.basicChain = {stage:0, confirmed:false, expires:0};
    f.dashTime=0; f.dashCD=0; f.dashVX=0; f.parryCD=0;
    return f;
  };

  const newRound = Fight.newRound.bind(Fight);
  Fight.newRound = function(...args) {
    Input.buffers=[{},{}];
    const result = newRound(...args);
    this.g.impacts=[];
    if(this.g.mode==='training')this.g.coach={enabled:readStore('clash-coach-v1',true),
      phase:0,origin:this.g.f[0].x,basicHit:false,skillUsed:false};
    return result;
  };

  Fight.canChain = function(f, action) {
    const c=f.basicChain;
    if(!['punch','kick'].includes(action)||!c||!c.confirmed||c.stage>=3||
       this.g?.state!=='active'||this.g.t>c.expires||f.stun>0||f.block||f.recovery>.32) return false;
    // Do not cancel the windup or active frames before the hit has resolved.
    return !f.attack||f.attack.t>=f.attack.startup+f.attack.active;
  };

  const strike = Fight.attack.bind(Fight);
  Fight.attack = function(f, kind) {
    if(!['punch','kick'].includes(kind)) return strike(f,kind);
    const chain=this.canChain(f,kind), old=f.attack;
    if(chain) f.recovery=0;
    strike(f,kind);
    if(f.attack===old||f.attack?.kind!==kind) return;
    const stage=chain?Math.min(3,f.basicChain.stage+1):1;
    f.basicChain={stage,confirmed:false,expires:this.g.t+.86};
    f.attack.chainStage=stage;
    f.attack.startup=kind==='punch'?.075:.115;
    f.attack.active=kind==='punch'?.135:.15;
    f.recovery=(kind==='punch'?.38:.5)*(stage===3?1.12:1);
    if(stage>1) {
      this.spark(f.x+f.face*33,f.y-60,f.c.color,7);
      if(stage===3) this.float('ФИНАЛ СЕРИИ',f.x,f.y-128,f.c.color);
    }
  };

  const applyDamage = Fight.damage.bind(Fight);
  Fight.damage = function(target, amount, owner, options={}) {
    if(!target||!owner||!this.g) return false;
    const basic=owner.attack?.chainStage>0&&options.level&&
       (options.kb===70||options.kb===150);
    const stage=basic?owner.attack.chainStage:1;
    const opts=basic?{...options,kb:options.kb*(stage===3?1.6:stage===2?1.12:1)}:options;
    const value=basic?amount*(stage===2?1.08:stage===3?1.16:1):amount;
    const originalHp=target.hp;
    const readyParry=(target.parryCD||0)<=0&&target.block&&target.blockTime<.12&&
      target.guardLock<=0&&!opts.unblockable&&target.face*(owner.x-target.x)>0&&!(target.st?.inv>0);
    // Quick block tapping is not an infinite perfect-block strategy.
    if(!readyParry&&target.block&&target.blockTime<.12&&(target.parryCD||0)>0)
      target.blockTime=.13;
    const hit=applyDamage(target,value,owner,opts);
    if(!hit) return hit;
    if(readyParry){
      target.parryCD=.88;
      target.pe=Math.min(target.c.pe,target.pe+3);
      target.guard=Math.min(100,target.guard+8);
      owner.recovery=Math.max(owner.recovery||0,.22);
      this.g.hitstop=Math.max(this.g.hitstop,.072);
      const label=this.g.texts?.findLast?.(t=>t.t==='ИДЕАЛЬНЫЙ БЛОК');
      if(label) label.t='ПАРИРОВАНИЕ!';
      this.spark(target.x,target.y-58,'#d8fff5',18);
      AudioSys.sfx('parry');
    }
    if(basic&&owner.basicChain){
      owner.basicChain.confirmed=true;
      owner.basicChain.expires=this.g.t+.86;
      if(target.hp<originalHp)target.stun=Math.max(target.stun,stage===3?.19:.12);
      if(owner.side===0&&target.side===1&&this.g.coach)this.g.coach.basicHit=true;
    }
    if(originalHp>target.hp){
      const heavy=originalHp-target.hp>=19||stage===3;
      this.g.hitstop=Math.max(this.g.hitstop,heavy?.085:basic?.052:.045);
      const impacts=this.g.impacts??(this.g.impacts=[]);
      impacts.push({x:target.x,y:target.y-52,life:heavy?.31:.23,total:heavy?.31:.23,
        heavy,color:owner.c?.color||'#e7d9b9'});
      if(impacts.length>24)impacts.shift();
    }
    return hit;
  };

  const visualStep=Fight.visualStep.bind(Fight);
  Fight.visualStep=function(dt){
    visualStep(dt);
    for(const f of this.g?.f||[])f.parryCD=Math.max(0,(f.parryCD||0)-dt);
    if(this.g?.impacts)this.g.impacts=this.g.impacts.filter(p=>(p.life-=dt)>0);
    const g=this.g,c=g?.coach,f=g?.f?.[0];
    if(c?.enabled&&f&&g.state==='active'&&c.phase<5){
      const complete=[()=>Math.abs(f.x-c.origin)>55,()=>c.basicHit,
        ()=>f.basicChain?.stage===3,()=>f.dashTime>0,()=>c.skillUsed][c.phase];
      if(complete?.()){c.phase++;AudioSys.sfx('target')}
    }
  };

  const cast=Fight.cast.bind(Fight);
  Fight.cast=function(f,i){
    const success=cast(f,i);
    if(success&&f.side===0&&this.g?.coach)this.g.coach.skillUsed=true;
    return success;
  };

  const originalTrainingUI=Fight.trainingUI.bind(Fight);
  Fight.trainingUI=function(){
    originalTrainingUI();
    if(this.g?.mode!=='training')return;
    const toolbar=document.querySelector('#trainingTools');
    if(toolbar){
      const toggle=document.createElement('button');
      toggle.textContent='Подсказки: '+(this.g.coach?.enabled?'ВКЛ':'ВЫКЛ');
      toggle.addEventListener('click',()=>{
        const coach=this.g?.coach;if(!coach)return;
        coach.enabled=!coach.enabled;saveStore('clash-coach-v1',coach.enabled);
        this.trainingUI();
      });
      toolbar.append(toggle);
    }
  };

  const sfx=AudioSys.sfx.bind(AudioSys);
  AudioSys.sfx=function(kind){
    if(kind==='dash')return this.tone(375,.09,'triangle',.085);
    if(kind==='parry'){
      this.tone(780,.16,'triangle',.13);
      this.tone(1170,.07,'sine',.045);
      return;
    }
    if(kind==='hit'){
      this.tone(102,.095,'sawtooth',.155);
      this.tone(64,.14,'triangle',.072);
      return;
    }
    if(kind==='block'){
      this.tone(390,.065,'square',.065);
      this.tone(640,.045,'triangle',.07);
      return;
    }
    sfx(kind);
  };

  const setupGame=App.gameUI.bind(App);
  App.gameUI=function(rt=false){
    setupGame(rt);
    if(rt)return;
    const badge=document.createElement('div');
    badge.id='dashStatus';badge.className='dash-status ready';
    badge.innerHTML='<b>РЫВОК ГОТОВ</b>2× направление';
    document.querySelector('.combat-footer .control-hint')?.before(badge);
  };

  const updateHUD=Fight.updateHUD.bind(Fight);
  Fight.updateHUD=function(){
    updateHUD();
    const e=document.querySelector('#dashStatus');
    if(!e||!this.g?.f?.length)return;
    const f=this.g.f[this.g.mode==='online'&&Net.role==='client'?1:0];
    const ready=(f.dashCD||0)<=.001;
    e.classList.toggle('ready',ready);
    e.innerHTML=ready?'<b>РЫВОК ГОТОВ</b>2× направление':
      `<b>РЫВОК · ${f.dashCD.toFixed(1)} с</b>перезарядка`;
  };

  const combatDraw=Fight.draw.bind(Fight);
  Fight.draw=function(){
    combatDraw();
    const g=this.g,ctx=App.ctx;
    if(!g||!ctx||!['active','ko','finisher'].includes(g.state))return;
    const xAt=x=>550+(x-g.cam.x)*g.cam.zoom;
    const yAt=y=>460+(y-460)*g.cam.zoom;
    ctx.save();
    for(const f of g.f){
      if((f.dashTime||0)>0&&Pref.effects){
        ctx.globalAlpha=.15+.11*Math.sin(g.t*36)**2;
        ctx.fillStyle=f.c.color;
        ctx.beginPath();ctx.ellipse(xAt(f.x)-f.face*35,yAt(f.y-49),20,53,-.1,0,Math.PI*2);ctx.fill();
        ctx.globalAlpha=1;
      }
      const a=f.attack;
      if(a&&Pref.effects){
        const active=a.t>=a.startup&&a.t<a.startup+a.active;
        const windup=a.t<a.startup;
        const px=xAt(f.x+f.face*(a.kind==='punch'?57:66)),py=yAt(f.y-(a.kind==='punch'?62:28));
        ctx.strokeStyle=active?f.c.color:windup?'#f4e0b4':'#95a7b3';
        ctx.globalAlpha=active?.86:windup?.33:.14;
        ctx.lineWidth=active?5:2.5;
        ctx.beginPath();ctx.arc(px,py,active?23:16,f.face>0?-1.4:1.74,f.face>0?1.4:4.54);ctx.stroke();
        ctx.globalAlpha=1;
      }
      if(f.basicChain?.stage>=2&&g.t<=f.basicChain.expires){
        const fade=clamp((f.basicChain.expires-g.t)*2,0,1);
        ctx.globalAlpha=fade;
        ctx.font='bold 16px system-ui';ctx.textAlign='center';
        ctx.fillStyle='#09171c';ctx.fillText(`${f.basicChain.stage} × СЕРИЯ`,xAt(f.x)+1,yAt(f.y-139)+1);
        ctx.fillStyle=f.c.color;ctx.fillText(`${f.basicChain.stage} × СЕРИЯ`,xAt(f.x),yAt(f.y-139));
        ctx.globalAlpha=1;
      }
    }
    if(Pref.effects)for(const p of g.impacts||[]){
      const k=1-p.life/p.total,px=xAt(p.x),py=yAt(p.y);
      ctx.globalAlpha=(1-k)*(p.heavy?.9:.7);
      ctx.lineWidth=p.heavy?4:2;ctx.strokeStyle=p.color;
      ctx.beginPath();ctx.arc(px,py,(p.heavy?8:5)+k*(p.heavy?42:27),0,Math.PI*2);ctx.stroke();
      for(let i=0;i<(p.heavy?8:4);i++){
        const a=i*Math.PI/(p.heavy?4:2);
        ctx.beginPath();ctx.moveTo(px+Math.cos(a)*16,py+Math.sin(a)*16);
        ctx.lineTo(px+Math.cos(a)*(21+k*38),py+Math.sin(a)*(21+k*38));ctx.stroke();
      }
    }
    ctx.restore();
    if(g.mode==='training'){
      ctx.save();ctx.fillStyle='#c2dfd9';ctx.textAlign='left';ctx.font='11px system-ui';
      ctx.fillText('Серии: удар → удар → нога · рывок: двойное направление · парирование: блок в последний момент',20,118);
      if(g.coach?.enabled){
        const prompts=['1/5 · Пройди несколько шагов влево или вправо',
          '2/5 · Попади обычным ударом (Z или X)',
          '3/5 · Продолжай попадания до серии из трёх ударов',
          '4/5 · Сделай рывок двойным нажатием направления',
          '5/5 · Примени любую технику персонажа (1–4)',
          'Тренировка пройдена! Попробуй защиту и авторские приёмы.'];
        ctx.font='bold 13px system-ui';
        ctx.fillStyle=g.coach.phase>=5?'#b4efd7':'#f4d59c';
        ctx.fillText(prompts[g.coach.phase],20,139);
      }
      ctx.restore();
    }
  };

  const showHelp=App.help.bind(App);
  App.help=function(){
    showHelp();
    const box=document.querySelector('#modalRoot .help-note');
    if(box)box.insertAdjacentHTML('beforebegin',
      '<p class="help-note"><b>Новые приёмы боя:</b> дважды быстро нажми направление для рывка (перезарядка 0,7 с). Попадание кулаком или ногой позволяет продолжить серию до трёх ударов; последняя атака сильнее отбрасывает. Идеальный блок в первые 0,12 с даёт немного ПЭ и замедляет нападающего, но затем 0,9 с нельзя парировать повторно. Подсказки по сериям есть в тренировке.</p>');
  };
})();
